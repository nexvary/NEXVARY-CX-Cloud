# NEXVARY CX Cloud — Production Docker Compose
# Single-command deployment: sudo bash deploy/docker-install.sh --domain=your.domain.com
#
# Service topology:
#   nginx         → app (PHP-FPM tcp:9000), rtc-bridge (ws:3000)  [bridge network]
#   app / queue / scheduler  → postgres, redis              [bridge network]
#   app / rtc-bridge         → freeswitch ESL/WS via host.docker.internal
#   freeswitch               → host network (SIP/RTP require host networking)
#   postgres / redis         → 127.0.0.1 host port for host-network freeswitch
#
# FreeSWITCH uses network_mode: host so it binds directly to the server's
# network interfaces for SIP (5060) and RTP (16384-16484).  All other services
# use the nexvary-net bridge.  The app and rtc-bridge containers reach
# FreeSWITCH via host.docker.internal (resolved to the Docker bridge gateway).
#
# Nginx is bound to 127.0.0.1:8080 — the existing host Nginx acts as the
# TLS reverse proxy.  See deploy/nginx-proxy.conf.example.

x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: production
  image: nexvary-cx-app:${APP_VERSION:-latest}
  env_file: deploy/.env
  volumes:
    - app_storage:/var/www/nexvary-cx/storage
    - app_cache:/var/www/nexvary-cx/bootstrap/cache
  networks:
    - nexvary-net
  # Containers need to reach FreeSWITCH on the host network via host.docker.internal
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  # ── Web application (PHP-FPM) ───────────────────────────────────────────────
  app:
    <<: *app-common
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>&1 | grep -q OK || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 3

  # ── Queue worker ────────────────────────────────────────────────────────────
  queue:
    <<: *app-common
    entrypoint: ["php", "/var/www/nexvary-cx/artisan", "queue:work", "redis",
                 "--sleep=3", "--tries=3", "--timeout=90",
                 "--max-time=3600", "--max-jobs=1000"]
    healthcheck:
      test: ["CMD", "php", "/var/www/nexvary-cx/artisan", "queue:monitor", "redis:default"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Scheduler ───────────────────────────────────────────────────────────────
  scheduler:
    <<: *app-common
    entrypoint:
      - /bin/sh
      - -c
      - >
        while true; do
          php /var/www/nexvary-cx/artisan schedule:run --no-interaction;
          sleep 60;
        done
    healthcheck:
      test: ["CMD", "php", "/var/www/nexvary-cx/artisan", "about", "--json"]
      interval: 120s
      timeout: 10s
      start_period: 30s
      retries: 2

  # ── Nginx reverse proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/conf/app.conf:/etc/nginx/conf.d/default.conf:ro
      # Serve Laravel public assets directly from the app image
      - ./public:/var/www/nexvary-cx/public:ro
      - app_storage_public:/var/www/nexvary-cx/storage/app/public:ro
    ports:
      # Bound to loopback — the host Nginx proxies HTTPS requests here.
      # Change to 0.0.0.0:8080:80 only if no existing host Nginx is present.
      - "127.0.0.1:${NEXVARY_HTTP_PORT:-8080}:80"
    networks:
      - nexvary-net
    depends_on:
      app:
        condition: service_healthy
      rtc-bridge:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up | grep -q ok || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── WebRTC signaling bridge ─────────────────────────────────────────────────
  rtc-bridge:
    build:
      context: rtc-bridge
      dockerfile: Dockerfile
    image: nexvary-cx-rtc-bridge:${APP_VERSION:-latest}
    env_file: deploy/.env
    environment:
      RTC_BIND_ADDRESS: "0.0.0.0"
      # FreeSWITCH is on the host network; reach it via host.docker.internal
      FREESWITCH_HOST: "host.docker.internal"
    networks:
      - nexvary-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-bookworm
    env_file: deploy/.env
    environment:
      POSTGRES_DB:       "${DB_DATABASE:-nexvary_cx}"
      POSTGRES_USER:     "${DB_USERNAME:-nexvary_cx}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    # Bind to 127.0.0.1 on the host so host-network FreeSWITCH can reach PostgreSQL
    # (FreeSWITCH uses mod_pgsql for CDR if configured)
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - nexvary-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-nexvary_cx} -d ${DB_DATABASE:-nexvary_cx}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0", "--loglevel", "warning"]
    env_file: deploy/.env
    volumes:
      - redis_data:/data
    # Bind to 127.0.0.1 on the host so host-network FreeSWITCH can reach Redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - nexvary-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  # ── FreeSWITCH 1.10.11 ──────────────────────────────────────────────────────
  # Uses host networking for SIP/RTP — this is the standard production pattern.
  # It binds directly to the server's network interfaces.
  freeswitch:
    image: ghcr.io/nexvary/nexvary-cx-freeswitch:1.10.11
    # Build locally only if the GHCR image is not yet published:
    #   docker compose build freeswitch
    build:
      context: docker/freeswitch
      dockerfile: Dockerfile
    network_mode: host
    env_file: deploy/.env
    environment:
      FREESWITCH_CONF_DIR: "/etc/freeswitch"
      FREESWITCH_LOG_DIR:  "/var/log/freeswitch"
    volumes:
      - fs_conf:/etc/freeswitch
      - fs_logs:/var/log/freeswitch
      - fs_recordings:/var/lib/freeswitch/recordings
    # host networking means no port mapping — FreeSWITCH uses the host's
    # interfaces directly (5060/udp, 5060/tcp, 5061/tcp, 8021/tcp, 5066/tcp,
    # 7443/tcp, RTP 16384-16484/udp)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -p \"${FREESWITCH_ESL_PASSWORD:-}\" -x 'status' 2>/dev/null | grep -q 'UP' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

# ── Named volumes ───────────────────────────────────────────────────────────────
volumes:
  pg_data:
    name: nexvary_pg_data
  redis_data:
    name: nexvary_redis_data
  app_storage:
    name: nexvary_app_storage
  app_cache:
    name: nexvary_app_cache
  app_storage_public:
    name: nexvary_app_storage_public
  fs_conf:
    name: nexvary_fs_conf
  fs_logs:
    name: nexvary_fs_logs
  fs_recordings:
    name: nexvary_fs_recordings

# ── Bridge network ──────────────────────────────────────────────────────────────
networks:
  nexvary-net:
    name: nexvary_net
    driver: bridge
