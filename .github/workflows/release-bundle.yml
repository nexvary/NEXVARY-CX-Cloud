name: "NEXVARY CX — Release Bundle"

# Produces a versioned installation bundle alongside every push that changes
# installer scripts or the Android app, and on every pull-request to master.
#
# Two jobs:
#   bundle  — assembles the tarball, writes the pinned RELEASE file, computes
#             SHA-256 checksums, and uploads the artifact.
#   verify  — unpacks the uploaded artifact inside a Debian 13 container and
#             runs installer/tests/test-pinned-sha.sh to prove the installer
#             will use the exact release SHA and that the version-mismatch
#             guard fires correctly.  A passing tarball upload alone is NOT
#             sufficient; this job must also succeed.

on:
  push:
    branches: ["feature/stage-1-foundation"]
    paths:
      - "installer/**"
      - "android/**"
      - "INSTALL-NEXVARY.sh"
      - "UPDATE-NEXVARY.sh"
      - ".github/workflows/release-bundle.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      bundle_dir:     ${{ steps.meta.outputs.bundle_dir }}
      bundle_version: ${{ steps.meta.outputs.bundle_version }}
      commit_sha:     ${{ steps.meta.outputs.commit_sha }}
      short_sha:      ${{ steps.meta.outputs.short_sha }}
      artifact_name:  ${{ steps.meta.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On pull_request events, github.sha is a synthetic PR merge commit.
          # Always check out the actual source commit so the bundle is pinned correctly.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Gather version metadata
        id: meta
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # On pull_request events, github.sha is a synthetic merge commit that
          # GitHub constructs for the PR.  Use the PR head SHA when available.
          if [[ -n "${PR_HEAD_SHA:-}" ]]; then
            COMMIT_SHA="${PR_HEAD_SHA}"
          else
            COMMIT_SHA="${PUSH_SHA}"
          fi
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BUNDLE_VERSION="1.0.0-rc.${SHORT_SHA}"
          BUNDLE_DIR="nexvary-cx-${BUNDLE_VERSION}"
          ARTIFACT_NAME="nexvary-cx-release-bundle-${SHORT_SHA}"
          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "bundle_version=${BUNDLE_VERSION}"
            echo "bundle_dir=${BUNDLE_DIR}"
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Assert checkout HEAD matches target SHA
        # Proves the checkout ref resolved to the branch HEAD, not to a synthetic
        # PR merge commit.  Fail fast so the RELEASE file is never pinned to a
        # commit that does not exist on any real branch.
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.meta.outputs.commit_sha }}"
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            printf '[FAIL] HEAD mismatch:\n  expected: %s\n  actual:   %s\n' \
              "${EXPECTED_SHA}" "${ACTUAL_SHA}" >&2
            exit 1
          fi
          printf '[PASS] HEAD=%s\n' "${ACTUAL_SHA}"

      - name: Assemble bundle directory
        run: |
          BUNDLE_DIR="${{ steps.meta.outputs.bundle_dir }}"
          mkdir -p "${BUNDLE_DIR}/installer"
          cp -r installer/. "${BUNDLE_DIR}/installer/"
          cp INSTALL-NEXVARY.sh "${BUNDLE_DIR}/"
          cp UPDATE-NEXVARY.sh  "${BUNDLE_DIR}/"

      - name: Write pinned RELEASE file
        # Authoritative source of the application revision this bundle installs.
        # installer/lib/app.sh reads this and refuses to deploy any other commit.
        run: |
          COMMIT_SHA="${{ steps.meta.outputs.commit_sha }}"
          BUNDLE_DIR="${{ steps.meta.outputs.bundle_dir }}"
          printf '%s\n' "${COMMIT_SHA}" > "${BUNDLE_DIR}/installer/RELEASE"
          echo "RELEASE file: $(cat "${BUNDLE_DIR}/installer/RELEASE")"

      - name: Generate INSTALL.md from template
        # Uses envsubst so the template lives in-repo (installer/INSTALL.md.in)
        # and no heredoc is embedded in YAML, avoiding column-0 parse failures.
        env:
          COMMIT_SHA:       ${{ steps.meta.outputs.commit_sha }}
          COMMIT_SHA_SHORT: ${{ steps.meta.outputs.short_sha }}
          BUNDLE_VERSION:   ${{ steps.meta.outputs.bundle_version }}
          BUILD_TIMESTAMP:  ${{ steps.meta.outputs.timestamp }}
        run: |
          BUNDLE_DIR="${{ steps.meta.outputs.bundle_dir }}"
          envsubst < installer/INSTALL.md.in > "${BUNDLE_DIR}/INSTALL.md"
          echo "INSTALL.md generated ($(wc -l < "${BUNDLE_DIR}/INSTALL.md") lines)"

      - name: Compute SHA-256 checksums
        run: |
          BUNDLE_DIR="${{ steps.meta.outputs.bundle_dir }}"
          find "${BUNDLE_DIR}" -type f | sort | xargs sha256sum > "${BUNDLE_DIR}/SHA256SUMS"
          echo "Generated $(wc -l < "${BUNDLE_DIR}/SHA256SUMS") checksums"
          cat "${BUNDLE_DIR}/SHA256SUMS"

      - name: Create tarball
        run: |
          BUNDLE_DIR="${{ steps.meta.outputs.bundle_dir }}"
          tar -czf "${BUNDLE_DIR}.tar.gz" "${BUNDLE_DIR}/"
          sha256sum "${BUNDLE_DIR}.tar.gz" > "${BUNDLE_DIR}.tar.gz.sha256"
          echo "Tarball: $(ls -lh "${BUNDLE_DIR}.tar.gz" | awk '{print $5, $9}')"
          echo "Checksum: $(cat "${BUNDLE_DIR}.tar.gz.sha256")"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.meta.outputs.bundle_dir }}.tar.gz
            ${{ steps.meta.outputs.bundle_dir }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload bundle directory (for verify job)
        uses: actions/upload-artifact@v4
        with:
          name: nexvary-cx-bundle-unpacked-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.meta.outputs.bundle_dir }}/
          if-no-files-found: error
          retention-days: 90

  # ── Verify job ──────────────────────────────────────────────────────────────
  # Downloads the unpacked bundle artifact and runs test-pinned-sha.sh inside
  # a Debian 13 container to prove:
  #   1. installer/RELEASE exists and contains the build SHA
  #   2. nexvary-install.sh correctly reads and exports NX_RELEASE_COMMIT
  #   3. Version-mismatch guard: same SHA → no-op
  #   4. Version-mismatch guard: different SHA without --upgrade-from → fatal
  #   5. Version-mismatch guard: matching --upgrade-from → proceeds
  verify:
    name: Verify pinned SHA and mismatch guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: bundle

    steps:
      - name: Download unpacked bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: nexvary-cx-bundle-unpacked-${{ needs.bundle.outputs.short_sha }}
          path: bundle/

      - name: Run SHA contract tests in Debian 13 container
        run: |
          COMMIT_SHA="${{ needs.bundle.outputs.commit_sha }}"
          docker run --rm \
            -v "$PWD/bundle:/bundle:ro" \
            debian:trixie \
            bash /bundle/installer/tests/test-pinned-sha.sh /bundle "${COMMIT_SHA}"

      - name: Verify RELEASE SHA survives artifact round-trip
        run: |
          COMMIT_SHA="${{ needs.bundle.outputs.commit_sha }}"
          RELEASE_SHA="$(tr -d '[:space:]' < bundle/installer/RELEASE)"
          if [[ "${RELEASE_SHA}" == "${COMMIT_SHA}" ]]; then
            echo "[PASS] RELEASE SHA in artifact matches build SHA: ${RELEASE_SHA}"
          else
            echo "[FAIL] RELEASE SHA mismatch: expected=${COMMIT_SHA} got=${RELEASE_SHA}" >&2
            exit 1
          fi

      - name: Confirm RELEASE SHA is covered by SHA256SUMS
        run: |
          if grep -q "installer/RELEASE" bundle/SHA256SUMS; then
            echo "[PASS] installer/RELEASE is listed in SHA256SUMS"
          else
            echo "[FAIL] installer/RELEASE is NOT listed in SHA256SUMS" >&2
            exit 1
          fi
