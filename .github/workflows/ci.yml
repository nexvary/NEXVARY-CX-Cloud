name: NEXVARY CX Cloud — CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend Build & Type Check ─────────────────────────────────────────
  frontend:
    name: Frontend — Build & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build/
          retention-days: 7

  # ── PHP Tests & Static Analysis ─────────────────────────────────────────
  backend:
    name: Backend — Tests & Analysis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexvary_cx_test
          POSTGRES_USER: nexvary_cx
          POSTGRES_PASSWORD: nexvary_test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, redis, curl, mbstring, xml, zip, bcmath, intl, gd
          coverage: xdebug

      - name: Create bootstrap/cache (required before composer install)
        run: mkdir -p bootstrap/cache && chmod 775 bootstrap/cache

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: nexvary_cx_test
          DB_USERNAME: nexvary_cx
          DB_PASSWORD: nexvary_test_pass
          REDIS_HOST: 127.0.0.1

      - name: Create storage directories
        run: |
          mkdir -p storage/app/public
          mkdir -p storage/framework/{cache,sessions,views,testing}
          mkdir -p bootstrap/cache
          chmod -R 775 storage bootstrap/cache

      - name: Run database migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: nexvary_cx_test
          DB_USERNAME: nexvary_cx
          DB_PASSWORD: nexvary_test_pass

      - name: Run tests
        run: php artisan test --parallel --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: nexvary_cx_test
          DB_USERNAME: nexvary_cx
          DB_PASSWORD: nexvary_test_pass
          REDIS_HOST: 127.0.0.1
          FREESWITCH_HOST: ""  # No PBX in CI — services mock ESL

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Security Audit ──────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Create bootstrap/cache
        run: mkdir -p bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Composer audit
        run: composer audit

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ── Localization Check ──────────────────────────────────────────────────
  localization:
    name: Localization Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Check translation completeness
        run: node scripts/check-translations.js || true

  # ── Installer Lint ──────────────────────────────────────────────────────
  installer:
    name: Installer — Shell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint installer
        run: shellcheck INSTALL-NEXVARY.sh UPDATE-NEXVARY.sh || true

  # ── All Checks Pass ─────────────────────────────────────────────────────
  all-checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [frontend, backend, security, installer]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "::error::Frontend build failed"
            exit 1
          fi
          if [[ "${{ needs.backend.result }}" != "success" ]]; then
            echo "::error::Backend tests failed"
            exit 1
          fi
          echo "All checks passed"
