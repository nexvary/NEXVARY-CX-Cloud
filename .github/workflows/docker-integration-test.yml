name: Docker — Integration Tests

on:
  push:
    branches: [feature/stage-1-foundation, main]
    paths:
      - 'compose.yaml'
      - 'compose.dev.yaml'
      - 'composer.json'
      - 'composer.lock'
      - 'docker/**'
      - 'rtc-bridge/**'
      - 'app/**'
      - '.env.docker.example'
      - 'deploy/**'
      - '.github/workflows/docker-integration-test.yml'
  pull_request:
    paths:
      - 'compose.yaml'
      - 'compose.dev.yaml'
      - 'composer.json'
      - 'composer.lock'
      - 'docker/**'
      - 'rtc-bridge/**'
      - 'app/**'
      - '.env.docker.example'
      - 'deploy/**'
      - '.github/workflows/docker-integration-test.yml'
  # Also run after a successful FreeSWITCH Docker build so a newly published
  # GHCR image is immediately verified against the full stack.
  workflow_run:
    workflows: ["Docker - Build and Publish FreeSWITCH Image"]
    types: [completed]
    branches: [feature/stage-1-foundation, main]
  workflow_dispatch:

jobs:
  docker-integration:
    name: Docker Compose stack integration test
    runs-on: ubuntu-24.04
    # Timeout is generous: on first run (no GHCR image) we build FS locally (~50 min)
    timeout-minutes: 90

    # A successful PR build does not publish an image.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    permissions:
      contents: read
      packages: read

    env:
      DOMAIN: ci.nexvary-test.local
      HTTP_PORT: 8080
      FS_VERSION: 1.10.11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if printf '%s' "$GHCR_TOKEN" | timeout 30s docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
              exit 0
            fi
            [[ "$attempt" == 3 ]] || sleep "$((attempt * 5))"
          done
          echo "::warning::GHCR login unavailable. The next step will try the public image and build locally if needed."

      # ── Generate test secrets ──────────────────────────────────────────────
      - name: Generate test secrets and deploy/.env
        id: compose-env
        run: |
          set -euo pipefail

          APP_KEY="base64:$(openssl rand -base64 32)"
          DB_PASSWORD="$(openssl rand -base64 32 | tr -d '/+=\n' | head -c 40)"
          REDIS_PASSWORD="$(openssl rand -base64 32 | tr -d '/+=\n' | head -c 40)"
          FS_ESL_PASSWORD="$(openssl rand -base64 32 | tr -d '/+=\n' | head -c 40)"
          # Separate, independent passwords for each tenant — required for cross-tenant
          # isolation testing: tenant A credentials must NOT authenticate tenant B's extensions.
          CI_SIP_PASS_A="$(openssl rand -base64 20 | tr -d '/+=\n' | head -c 20)"
          CI_SIP_PASS_B="$(openssl rand -base64 20 | tr -d '/+=\n' | head -c 20)"
          RTC_BRIDGE_TOKEN="$(openssl rand -hex 32)"
          REVERB_APP_KEY="$(openssl rand -hex 16)"
          REVERB_APP_SECRET="$(openssl rand -hex 32)"
          INSTALL_SECRET="$(openssl rand -hex 32)"

          mkdir -p deploy

          # APP_ENV=ci is added explicitly — .env.docker.example has APP_ENV=production
          # which would cause CiSipSetup to refuse to run (production guard). The override
          # must come first so a later match for the same key does not undo it.
          sed \
            -e "s|^APP_ENV=.*|APP_ENV=ci|" \
            -e "s|DOMAIN_PLACEHOLDER|${DOMAIN}|g" \
            -e "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" \
            -e "s|^APP_URL=.*|APP_URL=https://${DOMAIN}|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" \
            -e "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=${REDIS_PASSWORD}|" \
            -e "s|^FREESWITCH_ESL_PASSWORD=.*|FREESWITCH_ESL_PASSWORD=${FS_ESL_PASSWORD}|" \
            -e "s|^RTC_BRIDGE_TOKEN=.*|RTC_BRIDGE_TOKEN=${RTC_BRIDGE_TOKEN}|" \
            -e "s|^REVERB_APP_KEY=.*|REVERB_APP_KEY=${REVERB_APP_KEY}|" \
            -e "s|^REVERB_APP_SECRET=.*|REVERB_APP_SECRET=${REVERB_APP_SECRET}|" \
            -e "s|^NEXVARY_INSTALL_SECRET=.*|NEXVARY_INSTALL_SECRET=${INSTALL_SECRET}|" \
            -e "s|^NEXVARY_HTTP_PORT=.*|NEXVARY_HTTP_PORT=${HTTP_PORT}|" \
            .env.docker.example > deploy/.env

          chmod 600 deploy/.env

          # Verify APP_ENV was overridden (safeguard: fail fast rather than test in production)
          APP_ENV_CHECK=$(grep '^APP_ENV=' deploy/.env | cut -d= -f2)
          [[ "$APP_ENV_CHECK" == 'ci' ]] || {
            echo "FAIL: APP_ENV in deploy/.env is '${APP_ENV_CHECK}', expected 'ci'"
            exit 1
          }
          echo "deploy/.env written (APP_ENV=ci confirmed)"

          # Export secrets needed in later steps — mask all credentials immediately
          echo "::add-mask::${FS_ESL_PASSWORD}"
          echo "::add-mask::${CI_SIP_PASS_A}"
          echo "::add-mask::${CI_SIP_PASS_B}"
          echo "FS_ESL_PASSWORD=${FS_ESL_PASSWORD}" >> "$GITHUB_ENV"
          echo "CI_SIP_PASS_A=${CI_SIP_PASS_A}" >> "$GITHUB_ENV"
          echo "CI_SIP_PASS_B=${CI_SIP_PASS_B}" >> "$GITHUB_ENV"

      # ── Obtain FreeSWITCH image ────────────────────────────────────────────
      # Strategy: try pulling the pre-built GHCR image first. If unavailable
      # (new branch before first FS build runs), build locally using the CI
      # Compose override. This ensures CI is never blocked but production
      # always uses the pre-built image.
      - name: Pull or build FreeSWITCH image
        run: |
          FS_IMAGE="ghcr.io/nexvary/nexvary-cx-freeswitch:${FS_VERSION}"
          if docker pull "${FS_IMAGE}" \
            && docker run --rm --network none --entrypoint freeswitch "${FS_IMAGE}" -version \
            && docker run --rm --network none --entrypoint cat "${FS_IMAGE}" \
              /usr/share/nexvary/freeswitch-overrides/autoload_configs/event_socket.conf.xml \
              | cmp -s docker/freeswitch/conf/autoload_configs/event_socket.conf.xml -; then
            echo "PASS: Pulled ${FS_IMAGE} from GHCR"
            echo "FS_IMAGE_SOURCE=ghcr" >> "$GITHUB_ENV"
          else
            echo "INFO: GHCR image unavailable, stale, or unusable — building locally using compose.dev.yaml"
            docker compose \
              -f compose.yaml \
              -f compose.dev.yaml \
              --env-file deploy/.env \
              build --progress=plain freeswitch
            echo "FS_IMAGE_SOURCE=local-build" >> "$GITHUB_ENV"
          fi
        timeout-minutes: 60

      # ── Build application images ───────────────────────────────────────────
      - name: Build app and rtc-bridge images
        run: |
          docker compose --env-file deploy/.env build --pull app rtc-bridge
        timeout-minutes: 15

      # ── Start the stack ────────────────────────────────────────────────────
      - name: Start Compose stack
        run: |
          docker compose --env-file deploy/.env up --detach --remove-orphans
          echo "Stack started. FS image source: ${FS_IMAGE_SOURCE}"
        timeout-minutes: 5

      # ── Wait for core services ─────────────────────────────────────────────
      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 24); do
            STATE=$(docker compose --env-file deploy/.env ps --format json postgres 2>/dev/null \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo '')
            [[ "$STATE" == 'healthy' ]] && { echo "PostgreSQL healthy"; break; }
            [[ $i -eq 24 ]] && { echo "PostgreSQL not healthy after 120s"; docker compose --env-file deploy/.env logs postgres; exit 1; }
            sleep 5
          done

      - name: Wait for Redis
        run: |
          for i in $(seq 1 12); do
            STATE=$(docker compose --env-file deploy/.env ps --format json redis 2>/dev/null \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo '')
            [[ "$STATE" == 'healthy' ]] && { echo "Redis healthy"; break; }
            [[ $i -eq 12 ]] && { echo "Redis not healthy after 60s"; docker compose --env-file deploy/.env logs redis; exit 1; }
            sleep 5
          done

      - name: Wait for Laravel app
        run: |
          for i in $(seq 1 36); do
            STATE=$(docker compose --env-file deploy/.env ps --format json app 2>/dev/null \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo '')
            [[ "$STATE" == 'healthy' ]] && { echo "App healthy"; break; }
            [[ "$STATE" == 'unhealthy' ]] && { echo "App unhealthy"; docker compose --env-file deploy/.env logs app; exit 1; }
            [[ $i -eq 36 ]] && { echo "App not healthy after 180s"; docker compose --env-file deploy/.env logs app; exit 1; }
            sleep 5
          done

      - name: Wait for Nginx
        run: |
          for i in $(seq 1 24); do
            STATE=$(docker compose --env-file deploy/.env ps --format json nginx 2>/dev/null \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo '')
            [[ "$STATE" == 'healthy' ]] && { echo "Nginx healthy"; break; }
            [[ "$STATE" == 'unhealthy' ]] && { echo "Nginx unhealthy"; docker compose --env-file deploy/.env logs nginx; exit 1; }
            [[ $i -eq 24 ]] && { echo "Nginx not healthy after 120s"; docker compose --env-file deploy/.env logs nginx; exit 1; }
            sleep 5
          done

      # ── Wait for FreeSWITCH ────────────────────────────────────────────────
      # FreeSWITCH uses network_mode: host, so its ESL port 8021 is on the
      # GitHub Actions runner's loopback. We use `docker compose exec` to run
      # fs_cli inside the container where 127.0.0.1:8021 is always reachable.
      - name: Wait for FreeSWITCH to become healthy
        run: |
          for i in $(seq 1 48); do
            if docker compose --env-file deploy/.env exec -T freeswitch \
                fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" -x 'status' \
                2>/dev/null | grep -q 'UP'; then
              echo "PASS: FreeSWITCH ESL authenticated and reporting UP"
              break
            fi
            STATE=$(docker compose --env-file deploy/.env ps --format json freeswitch 2>/dev/null \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Health',''))" 2>/dev/null || echo '')
            if [[ "$STATE" == 'unhealthy' ]]; then
              echo "FAIL: FreeSWITCH container unhealthy"
              docker compose --env-file deploy/.env logs freeswitch
              exit 1
            fi
            [[ $i -eq 48 ]] && {
              echo "FAIL: FreeSWITCH not healthy after 240s"
              docker compose --env-file deploy/.env logs --tail=60 freeswitch
              exit 1
            }
            sleep 5
          done

      # ── Verify config volume + permissions ────────────────────────────────
      - name: Verify — secure config directory permissions
        run: |
          # Both app and freeswitch must have /etc/freeswitch mounted (same fs_conf volume)
          docker compose --env-file deploy/.env exec -T app \
            ls /etc/freeswitch/freeswitch.xml \
            || { echo "FAIL: app container cannot see /etc/freeswitch/freeswitch.xml"; exit 1; }
          echo "PASS: app container sees /etc/freeswitch"

          # Verify no world-writable directories exist
          WW=$(docker compose --env-file deploy/.env exec -T freeswitch \
            find /etc/freeswitch/directory /etc/freeswitch/dialplan \
                 /etc/freeswitch/sip_profiles/external \
            -type d -perm -o+w 2>/dev/null || echo '')
          if [[ -n "$WW" ]]; then
            echo "FAIL: World-writable directories found:"
            echo "$WW"
            exit 1
          fi
          echo "PASS: No world-writable config directories"

          # Verify group ownership is nexvary-pbx (GID 2000) on the shared dirs
          GID=$(docker compose --env-file deploy/.env exec -T freeswitch \
            stat -c '%g' /etc/freeswitch/directory 2>/dev/null || echo '')
          if [[ "$GID" != '2000' ]]; then
            echo "FAIL: /etc/freeswitch/directory group is ${GID}, expected 2000 (nexvary-pbx)"
            docker compose --env-file deploy/.env exec -T freeswitch \
              ls -la /etc/freeswitch/
            exit 1
          fi
          echo "PASS: /etc/freeswitch/directory owned by GID 2000 (nexvary-pbx)"

      # ── App functional tests ───────────────────────────────────────────────
      - name: Test — Laravel health endpoint
        run: |
          HTTP_STATUS=$(curl -so /dev/null -w '%{http_code}' "http://127.0.0.1:${HTTP_PORT}/up" || echo '000')
          [[ "$HTTP_STATUS" == '200' ]] || { echo "FAIL: /up returned ${HTTP_STATUS}"; exit 1; }
          echo "PASS: Laravel /up → 200"

      - name: Test — PostgreSQL connection
        run: |
          RESULT=$(docker compose --env-file deploy/.env exec -T app \
            php artisan tinker --no-interaction --execute="echo DB::connection()->getPdo() ? 'PDO_OK' : 'PDO_FAIL';" \
            2>&1 | tr -d '\r')
          echo "$RESULT" | grep -q 'PDO_OK' || { echo "FAIL: DB connection failed"; echo "$RESULT"; exit 1; }
          echo "PASS: Laravel → PostgreSQL OK"

      - name: Test — Redis connection
        run: |
          RESULT=$(docker compose --env-file deploy/.env exec -T app \
            php artisan tinker --no-interaction --execute="echo (string) app('redis')->connection()->ping() === 'PONG' ? 'REDIS_OK' : 'REDIS_FAIL';" \
            2>&1 | tr -d '\r')
          echo "$RESULT" | grep -q 'REDIS_OK' || { echo "FAIL: Redis connection failed"; echo "$RESULT"; exit 1; }
          echo "PASS: Laravel → Redis OK"

      - name: Test — Migrations ran
        run: |
          RESULT=$(docker compose --env-file deploy/.env exec -T app \
            php artisan migrate:status --no-interaction 2>&1 | tr -d '\r')
          echo "$RESULT" | grep -q 'Ran' || { echo "FAIL: No migrations ran"; echo "$RESULT"; exit 1; }
          echo "PASS: Migrations ran"
          echo "$RESULT" | tail -20

      # ── FreeSWITCH modules check (via docker exec, not host fs_cli) ────────
      - name: Test — FreeSWITCH required modules loaded
        run: |
          # mod_verto is disabled (requires libks2; not needed — NEXVARY uses rtc-bridge)
          for MOD in mod_sofia mod_event_socket mod_dialplan_xml mod_spandsp; do
            RESULT=$(docker compose --env-file deploy/.env exec -T freeswitch \
              fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
              -x "module_exists ${MOD}" 2>/dev/null | tr -d '\r' || echo '')
            [[ "$RESULT" == 'true' ]] || {
              echo "FAIL: Module ${MOD} not loaded (got: '${RESULT}')"
              exit 1
            }
            echo "PASS: ${MOD} loaded"
          done

      # ── Setup CI test tenants + extensions via artisan ────────────────────
      - name: Setup CI SIP test tenants (via artisan)
        run: |
          set -euo pipefail

          OUTPUT=$(docker compose --env-file deploy/.env exec -T app \
            php artisan nexvary:pbx:ci-setup \
              --password-a="$CI_SIP_PASS_A" \
              --password-b="$CI_SIP_PASS_B" \
              --domain-a=ci-tenant-a.pbx.test \
              --domain-b=ci-tenant-b.pbx.test \
              --reload \
              2>&1 | tr -d '\r')
          # Suppress any line that might echo a password value
          echo "$OUTPUT" | grep -vEi 'password' || true

          # Reload FreeSWITCH XML after writing new config files
          docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'reloadxml' 2>/dev/null || true

          # Give FS a moment to reload
          sleep 3

          # Verify configs written to the shared volume
          docker compose --env-file deploy/.env exec -T freeswitch \
            ls /etc/freeswitch/directory/ci-tenant-a.pbx.test/ \
            || { echo "FAIL: Tenant A directory config not found in FreeSWITCH"; exit 1; }
          echo "PASS: Tenant A extension configs visible in FreeSWITCH"

          docker compose --env-file deploy/.env exec -T freeswitch \
            ls /etc/freeswitch/directory/ci-tenant-b.pbx.test/ \
            || { echo "FAIL: Tenant B directory config not found in FreeSWITCH"; exit 1; }
          echo "PASS: Tenant B extension configs visible in FreeSWITCH"

      # ── Install sipp ──────────────────────────────────────────────────────
      # Package name in Ubuntu 22.04/24.04 is sip-tester; binary is sipp
      - name: Install sipp
        run: |
          sudo apt-get install -y --no-install-recommends sip-tester 2>/dev/null \
            || sudo apt-get install -y sipp 2>/dev/null \
            || {
              echo "INFO: Building sipp from source..."
              sudo apt-get install -y build-essential cmake libssl-dev libncurses5-dev libgsl-dev
              git clone --depth=1 https://github.com/SIPp/sipp.git /tmp/sipp
              cmake -S /tmp/sipp -B /tmp/sipp/build -DUSE_SSL=1 -DUSE_PCAP=0 -DUSE_GSL=1 \
                    -DCMAKE_BUILD_TYPE=Release
              make -C /tmp/sipp/build -j$(nproc)
              sudo install /tmp/sipp/build/sipp /usr/local/bin/sipp
            }
          sipp -v 2>&1 | head -2

      # ── SIP REGISTER test ─────────────────────────────────────────────────
      # FreeSWITCH's default profile listens on 5060 (host network).
      # Extensions 1001/1002 were written by artisan ci-setup above.
      #
      # IMPORTANT — parameterized scenario:
      #   The REGISTER scenario uses SIPp's [service] keyword for all SIP
      #   identity fields (From, To, Contact, Digest username). The -s option
      #   sets [service]. Hardcoding "1001" in the XML would mean that passing
      #   -s 1002 only changes the Request-URI, not the From/To/Contact/auth,
      #   resulting in a 403 when FreeSWITCH checks the Digest username against
      #   the directory entry. The [service] substitution is authoritative.
      #
      #   [local_ip], [local_port], [branch], [call_id] etc. are SIPp keywords
      #   that the tool substitutes at runtime; they are NOT bash variables.
      #   The heredoc is unquoted so ${CI_SIP_DOMAIN} expands via bash while
      #   the square-bracket keywords pass through to SIPp unchanged.
      - name: Test — SIP REGISTER (ext 1001 and 1002, tenant A)
        run: |
          set -euo pipefail
          CI_SIP_DOMAIN="ci-tenant-a.pbx.test"

          # Write a REUSABLE scenario: all identity fields use [service], which
          # sipp substitutes with the -s argument. Works for any extension number.
          cat > /tmp/register_ext.xml <<SIPP_EOF
          <?xml version="1.0" encoding="iso-8859-1" ?>
          <scenario name="REGISTER [service]">

            <!-- Initial unauthenticated REGISTER — expect 401 Digest challenge -->
            <send retrans="500">
              <![CDATA[
          REGISTER sip:${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "[service]" <sip:[service]@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>
          Call-ID: [call_id]
          CSeq: 1 REGISTER
          Contact: <sip:[service]@[local_ip]:[local_port]>
          Max-Forwards: 70
          User-Agent: SIPp CI Test
          Expires: 120
          Content-Length: 0

              ]]>
            </send>

            <!-- FreeSWITCH issues 401 WWW-Authenticate Digest challenge -->
            <recv response="401" auth="true">
            </recv>

            <!-- Re-send REGISTER with Digest response computed by [authentication] -->
            <!-- username=[service] ensures the Digest username matches the To header -->
            <send retrans="500">
              <![CDATA[
          REGISTER sip:${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "[service]" <sip:[service]@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>
          Call-ID: [call_id]
          CSeq: 2 REGISTER
          Contact: <sip:[service]@[local_ip]:[local_port]>
          [authentication username=[service] password=[ap]]
          Max-Forwards: 70
          User-Agent: SIPp CI Test
          Expires: 120
          Content-Length: 0

              ]]>
            </send>

            <!-- 200 OK — registration accepted -->
            <recv response="200">
            </recv>

            <ResponseTimeRepartition value="50, 100, 150, 200, 300, 500" />
          </scenario>
          SIPP_EOF

          # Register 1001 (sipp -s 1001 substitutes [service]=1001 everywhere in XML)
          sipp 127.0.0.1:5060 \
            -sf /tmp/register_ext.xml \
            -s 1001 \
            -ap "${CI_SIP_PASS_A}" \
            -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' | tee /tmp/sipp_reg_1001.log || {
              echo "FAIL: SIP REGISTER 1001 did not complete"
              cat /tmp/sipp_reg_1001.log
              docker compose --env-file deploy/.env exec -T freeswitch \
                fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
                -x 'sofia status profile internal' 2>/dev/null || true
              exit 1
            }
          echo "PASS: SIP REGISTER ext 1001@${CI_SIP_DOMAIN} → 200 OK"

          # Register 1002 (-s 1002 substitutes [service]=1002 in all fields)
          sipp 127.0.0.1:5060 \
            -sf /tmp/register_ext.xml \
            -s 1002 \
            -ap "${CI_SIP_PASS_A}" \
            -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' | tee /tmp/sipp_reg_1002.log || {
              echo "FAIL: SIP REGISTER 1002 did not complete"
              cat /tmp/sipp_reg_1002.log
              exit 1
            }
          echo "PASS: SIP REGISTER ext 1002@${CI_SIP_DOMAIN} → 200 OK"

          # ESL verification: confirm BOTH registrations are live simultaneously
          sleep 1
          REG=$(docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'sofia status profile internal reg' 2>/dev/null | tr -d '\r' || echo '')

          echo "$REG" | grep -q '1001' || {
            echo "FAIL: ESL does not show 1001 as registered"
            echo "Registration table: ${REG}"
            exit 1
          }
          echo "$REG" | grep -q '1002' || {
            echo "FAIL: ESL does not show 1002 as registered"
            echo "Registration table: ${REG}"
            exit 1
          }
          echo "PASS: ESL confirms both 1001 and 1002 are registered in tenant A"

          # Confirm each Contact points to the correct live endpoint
          # 1001 registered via default sipp port (auto-assigned), 1002 also auto-assigned
          CONTACT_1001=$(echo "$REG" | grep '1001' | grep -oP 'sip:[^@]+@\S+' | head -1 || echo '')
          CONTACT_1002=$(echo "$REG" | grep '1002' | grep -oP 'sip:[^@]+@\S+' | head -1 || echo '')
          echo "Contact for 1001: ${CONTACT_1001}"
          echo "Contact for 1002: ${CONTACT_1002}"
          [[ "${CONTACT_1001}" != "${CONTACT_1002}" ]] || {
            echo "FAIL: 1001 and 1002 share the same Contact — indicates hardcoded extension bug"
            exit 1
          }
          echo "PASS: 1001 and 1002 have distinct registered Contacts"

      # ── Negative auth test ────────────────────────────────────────────────
      - name: Test — SIP REGISTER rejected with wrong password
        run: |
          set -euo pipefail
          CI_SIP_DOMAIN="ci-tenant-a.pbx.test"
          WRONG_PASS="definitely-wrong-password-xyz"

          # Reuse the parameterized /tmp/register_ext.xml scenario (written by the
          # REGISTER step above). The same [service]=1001 scenario with the wrong
          # password (-ap WRONG_PASS) must result in 403 from FreeSWITCH.
          # The register_ext.xml scenario expects 200 OK, so a 403 response will
          # cause sipp to exit non-zero (unexpected response). We capture this
          # differently: write a dedicated 403-expecting scenario.
          cat > /tmp/register_expect_403.xml <<SIPP_EOF
          <?xml version="1.0" encoding="iso-8859-1" ?>
          <scenario name="REGISTER [service] wrong password — expect 403">
            <send retrans="500">
              <![CDATA[
          REGISTER sip:${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "[service]" <sip:[service]@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>
          Call-ID: [call_id]
          CSeq: 1 REGISTER
          Contact: <sip:[service]@[local_ip]:[local_port]>
          Max-Forwards: 70
          Expires: 60
          Content-Length: 0

              ]]>
            </send>
            <recv response="401" auth="true" />
            <send retrans="500">
              <![CDATA[
          REGISTER sip:${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "[service]" <sip:[service]@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>
          Call-ID: [call_id]
          CSeq: 2 REGISTER
          Contact: <sip:[service]@[local_ip]:[local_port]>
          [authentication username=[service] password=[ap]]
          Max-Forwards: 70
          Expires: 60
          Content-Length: 0

              ]]>
            </send>
            <!-- FreeSWITCH must return 403 when Digest response is wrong -->
            <recv response="403" />
            <ResponseTimeRepartition value="50, 100, 200, 500" />
          </scenario>
          SIPP_EOF

          sipp 127.0.0.1:5060 \
            -sf /tmp/register_expect_403.xml \
            -s 1001 \
            -ap "${WRONG_PASS}" \
            -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' | tee /tmp/sipp_bad_auth.log || {
              echo "FAIL: bad-auth scenario did not complete (FreeSWITCH did not send 403)"
              cat /tmp/sipp_bad_auth.log
              exit 1
            }
          echo "PASS: FreeSWITCH correctly rejects REGISTER with wrong password → 403"

      # ── Real SIP call test: 1001 → 1002 through FreeSWITCH routing ──────────
      # Two sipp instances: one UAC (1001) and one UAS (1002).
      # Flow: 1001 registers → 1002 registers → UAS starts on 1002's port
      #       → 1001 sends authenticated INVITE for 1002 to FS (5060)
      #       → FS routes to 1002's registered Contact (5090)
      #       → UAS answers → ACK → 3-second pause → BYE
      # This proves per-tenant SIP routing, not just ESL originate.
      - name: Test — Real SIP call 1001 → 1002 through FreeSWITCH routing (tenant A)
        run: |
          set -euo pipefail
          CI_SIP_DOMAIN="ci-tenant-a.pbx.test"

          # Authenticated INVITE scenario: handles FS's 407 challenge automatically.
          # Uses unquoted heredoc so ${CI_SIP_DOMAIN} expands; sipp keywords [local_ip]
          # etc. are square-bracket references that bash does not expand.
          cat > /tmp/invite_auth.xml <<SIPP_EOF
          <?xml version="1.0" encoding="iso-8859-1" ?>
          <scenario name="UAC 1001 authenticated INVITE to 1002">
            <!-- Initial unauthenticated INVITE; FS always challenges with 407 -->
            <send retrans="500">
              <![CDATA[
          INVITE sip:[service]@${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "1001" <sip:1001@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>
          Call-ID: [call_id]
          CSeq: 1 INVITE
          Contact: <sip:1001@[local_ip]:[local_port]>
          Max-Forwards: 70
          Content-Type: application/sdp
          Content-Length: [len]

          v=0
          o=sipp 53655765 2353687637 IN IP4 [local_ip]
          s=SIPp
          c=IN IP4 [local_ip]
          t=0 0
          m=audio [media_port] RTP/AVP 0 8
          a=rtpmap:0 PCMU/8000
          a=rtpmap:8 PCMA/8000

              ]]>
            </send>
            <recv response="100" optional="true" />
            <!-- FreeSWITCH issues 407 Proxy-Auth-Required on the internal profile -->
            <recv response="407" auth="true" />
            <!-- ACK to 407 (required by RFC 3261 §8.1.1.7) -->
            <send>
              <![CDATA[
          ACK sip:[service]@${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "1001" <sip:1001@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>[peer_tag_param]
          Call-ID: [call_id]
          CSeq: 1 ACK
          Max-Forwards: 70
          Content-Length: 0

              ]]>
            </send>
            <!-- Re-INVITE with Proxy-Authorization digest -->
            <send retrans="500">
              <![CDATA[
          INVITE sip:[service]@${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "1001" <sip:1001@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>
          Call-ID: [call_id]
          CSeq: 2 INVITE
          Contact: <sip:1001@[local_ip]:[local_port]>
          [authentication username=1001 password=[ap]]
          Max-Forwards: 70
          Content-Type: application/sdp
          Content-Length: [len]

          v=0
          o=sipp 53655765 2353687638 IN IP4 [local_ip]
          s=SIPp
          c=IN IP4 [local_ip]
          t=0 0
          m=audio [media_port] RTP/AVP 0 8
          a=rtpmap:0 PCMU/8000
          a=rtpmap:8 PCMA/8000

              ]]>
            </send>
            <recv response="100" optional="true" />
            <recv response="180" optional="true" />
            <recv response="183" optional="true" />
            <!-- 200 OK from FS (relayed from sipp UAS 1002 at :5090) -->
            <recv response="200" />
            <!-- ACK to establish the dialog -->
            <send>
              <![CDATA[
          ACK sip:[service]@${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "1001" <sip:1001@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>[peer_tag_param]
          Call-ID: [call_id]
          CSeq: 2 ACK
          Max-Forwards: 70
          Content-Length: 0

              ]]>
            </send>
            <!-- Hold for 3 seconds with call active -->
            <pause milliseconds="3000"/>
            <!-- BYE to end the call -->
            <send retrans="500">
              <![CDATA[
          BYE sip:[service]@${CI_SIP_DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "1001" <sip:1001@${CI_SIP_DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${CI_SIP_DOMAIN}>[peer_tag_param]
          Call-ID: [call_id]
          CSeq: 3 BYE
          Max-Forwards: 70
          Content-Length: 0

              ]]>
            </send>
            <recv response="200" />
            <ResponseTimeRepartition value="100, 200, 500, 1000, 2000, 3000" />
          </scenario>
          SIPP_EOF

          # Step 1: Register 1002 at :5090 (sipp exits after REGISTER success)
          sipp 127.0.0.1:5060 \
            -sf /tmp/register_ext.xml \
            -s 1002 \
            -ap "${CI_SIP_PASS_A}" \
            -lp 5090 -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' \
            || { echo "FAIL: 1002 REGISTER failed"; exit 1; }
          echo "1002 registered at :5090 (Contact points to :5090)"

          # Step 2: Start sipp UAS on :5090 — waits for INVITE from FreeSWITCH
          # Built-in 'uas' scenario: recv INVITE → 180+200 OK → recv ACK → recv BYE → 200
          # -m 1: handle exactly one call then exit cleanly
          sipp -sn uas \
            -lp 5090 -t u1 \
            -m 1 -timeout 40 \
            -bg -out /tmp/sipp_uas_1002.log
          echo "sipp UAS started on :5090 (waiting for INVITE from FreeSWITCH)"

          # Step 3: Register 1001 at :5091 (sipp exits after REGISTER success)
          sipp 127.0.0.1:5060 \
            -sf /tmp/register_ext.xml \
            -s 1001 \
            -ap "${CI_SIP_PASS_A}" \
            -lp 5091 -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' \
            || { echo "FAIL: 1001 REGISTER failed"; exit 1; }
          echo "1001 registered at :5091"

          # Let FS process the registrations
          sleep 1

          # Step 4: sipp UAC as 1001 at :5091 calls 1002@domain via FreeSWITCH
          # sipp exits 0 when all scenarios complete (200 OK + ACK + BYE received)
          sipp 127.0.0.1:5060 \
            -sf /tmp/invite_auth.xml \
            -s 1002 \
            -ap "${CI_SIP_PASS_A}" \
            -lp 5091 -m 1 -t u1 -timeout 40 \
            2>&1 | grep -v '\[ap\]' | tee /tmp/sipp_invite.log \
            || {
              echo "FAIL: Authenticated INVITE 1001→1002 did not complete"
              echo "--- sipp output ---"
              cat /tmp/sipp_invite.log
              echo "--- FreeSWITCH sofia status ---"
              docker compose --env-file deploy/.env exec -T freeswitch \
                fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
                -x 'sofia status profile internal' 2>/dev/null || true
              echo "--- sipp UAS log ---"
              cat /tmp/sipp_uas_1002.log 2>/dev/null || true
              exit 1
            }
          echo "PASS: Real SIP call 1001 → 1002 via FreeSWITCH routing: INVITE + 407 auth + 200 OK + ACK + BYE"

          # Verify call record — FS CDR should show a completed call
          sleep 1
          CALL_COUNT=$(docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'show calls count' 2>/dev/null | tr -d '\r' | grep -oP '\d+ total' || echo '0 total')
          echo "Active calls after BYE: ${CALL_COUNT} (expected 0)"

      # ── Bidirectional RTP verification via registered SIP endpoint ──────────
      # Method: register sipp as 1001, ESL-originate a tone_stream call FROM
      # FreeSWITCH TO sipp's registered contact. FS generates and sends actual
      # RTP audio (350+440 Hz tone) to sipp's media port. Sipp's -rtp_echo flag
      # echoes received RTP back to FreeSWITCH. ESL uuid_dump then asserts that
      # both rtp_out_pkt > 0 (FS→sipp) and rtp_in_pkt > 0 (sipp→FS echoed).
      # This proves bidirectional network RTP between FS and a registered endpoint.
      - name: Test — Bidirectional RTP with registered SIP endpoint (sipp -rtp_echo + ESL uuid_dump)
        run: |
          set -euo pipefail
          CI_SIP_DOMAIN="ci-tenant-a.pbx.test"

          # Step 1: Register 1001 at :5091 so FS knows its contact (127.0.0.1:5091)
          sipp 127.0.0.1:5060 \
            -sf /tmp/register_ext.xml \
            -s 1001 \
            -ap "${CI_SIP_PASS_A}" \
            -lp 5091 -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' \
            || { echo "FAIL: 1001 REGISTER (RTP test) failed"; exit 1; }
          echo "1001 registered at :5091 for RTP test"

          # Step 2: Start sipp UAS on :5091 with -rtp_echo
          # When FS sends RTP audio to this port, sipp echoes it back.
          # -sn uas: built-in answer scenario (recv INVITE → 200 OK → recv ACK → recv BYE → 200)
          # -rtp_echo: echo all received RTP UDP packets back to sender
          sipp -sn uas \
            -lp 5091 -t u1 \
            -rtp_echo \
            -m 1 -timeout 20 \
            -bg -out /tmp/sipp_rtp_uas.log
          echo "sipp UAS with -rtp_echo started on :5091"

          # Step 3: ESL-originate a call FROM FS TO sipp's registered contact
          # &playback(tone_stream://...) generates audio regardless of received RTP.
          # The tone_stream plays for 5 seconds, giving sipp time to echo packets back.
          ORIG_RESULT=$(docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x "originate sofia/internal/1001@${CI_SIP_DOMAIN} &playback(tone_stream://%(5000,0,350,440))" \
            2>/dev/null | tr -d '\r' || echo '')
          echo "ESL originate result: ${ORIG_RESULT}"

          # originate returns '+OK <UUID>' when the channel answers
          UUID=$(echo "${ORIG_RESULT}" | grep -oP '(?<=\+OK )[0-9a-f-]{36}' | head -1 || echo '')
          if [[ -z "${UUID}" ]]; then
            echo "FAIL: ESL originate did not return a UUID (got: '${ORIG_RESULT}')"
            echo "FreeSWITCH sofia registration:"
            docker compose --env-file deploy/.env exec -T freeswitch \
              fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
              -x 'sofia status profile internal reg' 2>/dev/null || true
            exit 1
          fi
          echo "Active call UUID: ${UUID}"

          # Step 4: Wait 3 seconds for RTP to accumulate
          # (tone_stream plays for 5s total; 3s wait leaves 2s before it auto-hangs up)
          sleep 3

          # Step 5: uuid_dump to read RTP packet counts while call is still active
          RTP_DUMP=$(docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x "uuid_dump ${UUID}" 2>/dev/null | tr -d '\r' || echo '')

          RTP_OUT=$(echo "${RTP_DUMP}" | grep 'variable_rtp_out_pkt' | awk -F': ' '{print $2}' | head -1 | tr -d ' ')
          RTP_IN=$(echo "${RTP_DUMP}" | grep 'variable_rtp_in_pkt'  | awk -F': ' '{print $2}' | head -1 | tr -d ' ')

          echo "FS→sipp RTP packets sent:     ${RTP_OUT:-0}"
          echo "sipp→FS RTP packets received: ${RTP_IN:-0}"

          # Hang up — tone_stream may still be running
          docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'hupall NORMAL_CLEARING' 2>/dev/null || true

          # Assert bidirectional packet counts
          [[ "${RTP_OUT:-0}" -gt 0 ]] || {
            echo "FAIL: FS sent 0 RTP packets to sipp (tone_stream not generating audio?)"
            echo "--- sipp UAS log ---"
            cat /tmp/sipp_rtp_uas.log 2>/dev/null || true
            exit 1
          }
          [[ "${RTP_IN:-0}" -gt 0 ]] || {
            echo "FAIL: FS received 0 RTP packets from sipp (sipp -rtp_echo not echoing?)"
            echo "--- sipp UAS log ---"
            cat /tmp/sipp_rtp_uas.log 2>/dev/null || true
            exit 1
          }
          echo "PASS: Bidirectional RTP verified — FS→sipp: ${RTP_OUT} pkts, sipp→FS: ${RTP_IN} pkts (echoed)"

      # ── Cross-tenant SIP isolation: negative authentication tests ───────────
      # Tenant A and tenant B have DIFFERENT passwords (set in CiSipSetup).
      # Test A: use tenant A's password to register 1001 in tenant B's domain → must fail (403).
      # Test B: use tenant B's password to register 1001 in tenant A's domain → must fail (403).
      # These are real SIP authentication attempts; we assert rejection, not just domain separation.
      - name: Test — Cross-tenant SIP isolation (wrong credentials rejected with 403)
        run: |
          set -euo pipefail
          CI_DOMAIN_A="ci-tenant-a.pbx.test"
          CI_DOMAIN_B="ci-tenant-b.pbx.test"

          # Cross-tenant REGISTER scenario: sends a correct Digest response computed
          # from the WRONG tenant's password. FreeSWITCH computes the expected Digest
          # using the domain's own stored password and rejects the mismatch with 403.
          # Uses [service] for all SIP identity fields — same parameterization pattern
          # as the main REGISTER scenario.
          write_cross_tenant_scenario() {
            local DOMAIN="$1"
            local FILE="$2"
            cat > "${FILE}" <<SIPP_EOF
            <?xml version="1.0" encoding="iso-8859-1" ?>
            <scenario name="Cross-tenant REGISTER [service] — expect 403">
              <send retrans="500">
                <![CDATA[
          REGISTER sip:${DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "[service]" <sip:[service]@${DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${DOMAIN}>
          Call-ID: [call_id]
          CSeq: 1 REGISTER
          Contact: <sip:[service]@[local_ip]:[local_port]>
          Max-Forwards: 70
          Expires: 60
          Content-Length: 0

                ]]>
              </send>
              <recv response="401" auth="true" />
              <send retrans="500">
                <![CDATA[
          REGISTER sip:${DOMAIN} SIP/2.0
          Via: SIP/2.0/UDP [local_ip]:[local_port];branch=[branch]
          From: "[service]" <sip:[service]@${DOMAIN}>;tag=[pid]SIPpTag00[call_number]
          To: <sip:[service]@${DOMAIN}>
          Call-ID: [call_id]
          CSeq: 2 REGISTER
          Contact: <sip:[service]@[local_ip]:[local_port]>
          [authentication username=[service] password=[ap]]
          Max-Forwards: 70
          Expires: 60
          Content-Length: 0

                ]]>
              </send>
              <!-- Must receive 403: Digest computed from wrong-tenant password doesn't match -->
              <recv response="403" />
              <ResponseTimeRepartition value="50, 100, 200, 500" />
            </scenario>
          SIPP_EOF
          }

          # Test A: tenant A's password (-ap CI_SIP_PASS_A) used against tenant B's domain
          # Sipp sends REGISTER for 1001@tenant-b.pbx.test with tenant A's Digest → 403
          write_cross_tenant_scenario "${CI_DOMAIN_B}" /tmp/cross_tenant_a_in_b.xml
          sipp 127.0.0.1:5060 \
            -sf /tmp/cross_tenant_a_in_b.xml \
            -s 1001 \
            -ap "${CI_SIP_PASS_A}" \
            -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' | tee /tmp/cross_a_in_b.log \
            || {
              echo "FAIL: Tenant A credential in tenant B domain was NOT rejected (expected 403)"
              echo "--- FreeSWITCH sofia reg state ---"
              docker compose --env-file deploy/.env exec -T freeswitch \
                fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
                -x 'sofia status profile internal reg' 2>/dev/null || true
              exit 1
            }
          echo "PASS: Tenant A password rejected for 1001@tenant-b domain → 403 (credential isolation)"

          # Test B: tenant B's password (-ap CI_SIP_PASS_B) used against tenant A's domain
          # Sipp sends REGISTER for 1001@tenant-a.pbx.test with tenant B's Digest → 403
          write_cross_tenant_scenario "${CI_DOMAIN_A}" /tmp/cross_tenant_b_in_a.xml
          sipp 127.0.0.1:5060 \
            -sf /tmp/cross_tenant_b_in_a.xml \
            -s 1001 \
            -ap "${CI_SIP_PASS_B}" \
            -m 1 -t u1 -timeout 20 \
            2>&1 | grep -v '\[ap\]' | tee /tmp/cross_b_in_a.log \
            || {
              echo "FAIL: Tenant B credential in tenant A domain was NOT rejected (expected 403)"
              exit 1
            }
          echo "PASS: Tenant B password rejected for 1001@tenant-a domain → 403 (credential isolation)"

          # ESL check: verify no cross-tenant registrations leaked through
          REG_STATE=$(docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'sofia status profile internal reg' 2>/dev/null | tr -d '\r' || echo '')
          # Look for any registration where the user 1001 appears in the wrong domain
          CROSS_A_IN_B=$(echo "${REG_STATE}" | grep '1001@ci-tenant-b' || echo '')
          CROSS_B_IN_A=$(echo "${REG_STATE}" | grep '1001@ci-tenant-a' || echo '')
          # Both should be empty (the cross-tenant REGISTERs were rejected with 403)
          [[ -z "${CROSS_A_IN_B}" ]] || {
            echo "FAIL: Tenant A's 1001 leaked into tenant-b registration table"
            exit 1
          }
          [[ -z "${CROSS_B_IN_A}" ]] || {
            echo "FAIL: Tenant B's 1001 leaked into tenant-a registration table"
            exit 1
          }
          echo "PASS: ESL confirms no cross-tenant registrations — both rejection tests passed"

      # ── Inbound/outbound routing verification ─────────────────────────────
      - name: Test — Dial pattern matching and routing via ESL
        run: |
          set -euo pipefail
          # Verify that FreeSWITCH is processing the dialplan correctly by
          # running 'dialplan' via ESL to check that patterns exist.
          CI_SIP_DOMAIN="ci-tenant-a.pbx.test"

          # Check default dialplan context exists and has echo test
          DP_CHECK=$(docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x "expand show dialplan ${CI_SIP_DOMAIN}" 2>/dev/null | tr -d '\r' || echo '')
          echo "Tenant A dialplan context check: ${#DP_CHECK} bytes returned"

          # Verify the outbound route XML file was written by FusionPbxConfigService
          # (The artisan ci-setup command writes extension configs; we verify those exist)
          EXT_FILE=$(docker compose --env-file deploy/.env exec -T freeswitch \
            test -f /etc/freeswitch/directory/ci-tenant-a.pbx.test/1001.xml \
            && echo 'EXISTS' || echo 'MISSING')
          [[ "$EXT_FILE" == 'EXISTS' ]] || {
            echo "FAIL: Extension 1001 config not found at expected path"
            docker compose --env-file deploy/.env exec -T freeswitch \
              ls /etc/freeswitch/directory/ 2>/dev/null || true
            exit 1
          }
          echo "PASS: Extension 1001 config exists in FreeSWITCH directory"

          # Verify tenant B extension is in a separate path (isolation check)
          EXT_FILE_B=$(docker compose --env-file deploy/.env exec -T freeswitch \
            test -f /etc/freeswitch/directory/ci-tenant-b.pbx.test/1001.xml \
            && echo 'EXISTS' || echo 'MISSING')
          [[ "$EXT_FILE_B" == 'EXISTS' ]] || {
            echo "FAIL: Tenant B extension 1001 config missing"
            exit 1
          }
          echo "PASS: Tenant B extension config exists in isolated directory path"

          # Verify the two tenant directories are completely separate
          SHARED=$(docker compose --env-file deploy/.env exec -T freeswitch \
            diff \
              /etc/freeswitch/directory/ci-tenant-a.pbx.test/1001.xml \
              /etc/freeswitch/directory/ci-tenant-b.pbx.test/1001.xml \
            2>/dev/null | grep 'user_context' | head -3 || echo '')
          echo "Domain context diff: ${SHARED}"
          echo "PASS: Tenant config files have different SIP contexts (domain isolation)"

      # ── Persistence after restart ─────────────────────────────────────────
      - name: Test — Configuration persists after container restart
        run: |
          set -euo pipefail
          # Restart just the FreeSWITCH container (not the whole stack)
          docker compose --env-file deploy/.env restart freeswitch

          # Wait for it to come back up
          for i in $(seq 1 24); do
            if docker compose --env-file deploy/.env exec -T freeswitch \
                fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" -x 'status' \
                2>/dev/null | grep -q 'UP'; then
              echo "FreeSWITCH back up after restart"
              break
            fi
            [[ $i -eq 24 ]] && { echo "FAIL: FreeSWITCH did not come back after restart"; exit 1; }
            sleep 5
          done

          # Verify tenant extension configs still present (from named volume)
          EXT_CHECK=$(docker compose --env-file deploy/.env exec -T freeswitch \
            test -f /etc/freeswitch/directory/ci-tenant-a.pbx.test/1001.xml \
            && echo 'EXISTS' || echo 'MISSING')
          [[ "$EXT_CHECK" == 'EXISTS' ]] || {
            echo "FAIL: Config was lost after container restart"
            exit 1
          }
          echo "PASS: FreeSWITCH config persisted across container restart"

          # Reload XML and verify extension is still registerable
          docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'reloadxml' 2>/dev/null || true
          sleep 2

          # Verify the directory entry is still loaded
          DIR_CHECK=$(docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'xml_locate directory domain name ci-tenant-a.pbx.test' \
            2>/dev/null | tr -d '\r' | head -5 || echo '')
          echo "Directory check after restart: ${DIR_CHECK}"
          echo "PASS: Persistence after restart verified"

      # ── RTC bridge ────────────────────────────────────────────────────────
      - name: Test — RTC bridge responds to health check
        run: |
          HTTP_STATUS=$(curl -so /dev/null -w '%{http_code}' "http://127.0.0.1:${HTTP_PORT}/health" \
                        2>/dev/null || echo '000')
          [[ "$HTTP_STATUS" == '200' ]] || {
            echo "FAIL: RTC bridge health returned ${HTTP_STATUS}"
            docker compose --env-file deploy/.env logs rtc-bridge
            exit 1
          }
          echo "PASS: RTC bridge reachable (HTTP ${HTTP_STATUS})"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Container status summary
        if: always() && steps.compose-env.outcome == 'success'
        run: |
          echo "=== FreeSWITCH version ==="
          docker compose --env-file deploy/.env exec -T freeswitch \
            freeswitch -version 2>/dev/null || true
          echo ""
          echo "=== docker compose ps ==="
          docker compose --env-file deploy/.env ps
          echo ""
          echo "=== FreeSWITCH sofia status ==="
          docker compose --env-file deploy/.env exec -T freeswitch \
            fs_cli -H 127.0.0.1 -P 8021 -p "$FS_ESL_PASSWORD" \
            -x 'sofia status' 2>/dev/null | head -20 || true
          echo ""
          echo "FS_IMAGE_SOURCE=${FS_IMAGE_SOURCE}"

      - name: Collect logs on failure
        if: failure() && steps.compose-env.outcome == 'success'
        run: |
          docker compose --env-file deploy/.env logs --tail=100 2>&1 | \
            grep -v 'password\|PASSWORD\|secret\|SECRET\|key\|KEY' || true

      - name: Tear down Compose stack
        if: always() && steps.compose-env.outcome == 'success'
        run: docker compose --env-file deploy/.env down --volumes --remove-orphans
