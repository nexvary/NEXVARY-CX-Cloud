name: "Docker - Build and Publish FreeSWITCH Image"

on:
  push:
    branches:
      - feature/stage-1-foundation
      - main
    paths:
      - 'docker/freeswitch/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'docker/freeswitch/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Push to GHCR even on PR (true/false)'
        required: false
        type: string
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nexvary/nexvary-cx-freeswitch
  FS_VERSION: "1.10.11"

jobs:
  build-freeswitch:
    name: "Build FreeSWITCH 1.10.11"
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' || github.event.inputs.force_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.FS_VERSION }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push FreeSWITCH image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: docker/freeswitch
          file: docker/freeswitch/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.inputs.force_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FS_VERSION=${{ env.FS_VERSION }}

      - name: Confirm build (PR only - image not pushed)
        if: ${{ github.event_name == 'pull_request' && github.event.inputs.force_push != 'true' }}
        run: echo "Build succeeded. Image not pushed on PR."

      - name: Verify published image
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.FS_VERSION }}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" freeswitch -version | grep -F "${{ env.FS_VERSION }}" \
            || { echo "ERROR: FreeSWITCH version mismatch"; exit 1; }
          echo "Published image verified: $IMAGE"
          echo "Digest: ${{ steps.build-push.outputs.digest }}"
