; NEXVARY CX Cloud — dedicated PHP-FPM pool
[nexvary-cx]
user  = nexvary
group = nexvary

; TCP socket — Nginx uses fastcgi_pass app:9000
listen = 0.0.0.0:9000
listen.allowed_clients = any

pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500

request_terminate_timeout = 120s

; Route PHP error log to container stdout
php_admin_value[error_log] = /proc/1/fd/2
php_admin_flag[log_errors]  = on
php_flag[display_errors]    = off

; Override www pool to prevent it from starting
[www]
pm = static
pm.max_children = 0
