## modules.conf — selects which modules are compiled into FreeSWITCH
## Lines starting with # are disabled; uncomment to enable.
##
## ROOT CAUSE NOTE: applications/mod_say_en and applications/mod_say_ar do NOT
## exist under src/mod/applications/ in FreeSWITCH 1.10.11. Those modules live
## exclusively under src/mod/say/. Listing them under applications/ caused
## bootstrap.sh to generate an invalid Makefile.am entry, producing the
## "Makefile:730: *** missing separator" build failure. The correct entries
## are say/mod_say_en and say/mod_say_ar below.

## Core applications
applications/mod_commands
applications/mod_dptools
applications/mod_dialplan_xml
applications/mod_dialplan_directory
applications/mod_spandsp
# mod_verto requires libks2 (SignalWire C SDK); NEXVARY uses its own Node.js
# rtc-bridge for WebRTC signaling via ESL — mod_verto is not needed.
#applications/mod_verto
applications/mod_voicemail
applications/mod_conference
applications/mod_ivr
applications/mod_hash
applications/mod_httapi
applications/mod_curl
applications/mod_xml_cdr
applications/mod_xml_curl
applications/mod_cdr_csv
applications/mod_tone_detect
applications/mod_expr
applications/mod_esl
applications/mod_callcenter

## Endpoints
endpoints/mod_sofia
endpoints/mod_loopback

## Event socket
event_handlers/mod_event_socket

## Formats / codecs
codecs/mod_opus
codecs/mod_g711
codecs/mod_g722
codecs/mod_g726
codecs/mod_gsm
codecs/mod_speex
codecs/mod_ilbc
# mod_amr requires OpenCORE AMR libraries (libopencore-amrnb-dev) which are
# not installed; remove to avoid configure detection failure.
#codecs/mod_amr
# mod_vp8 is a video codec; not needed for a voice PBX.
#codecs/mod_vp8

## Loggers
loggers/mod_console
loggers/mod_logfile
loggers/mod_syslog

## Timers
timers/mod_timerfd

## Languages
languages/mod_lua
#languages/mod_python3
#languages/mod_java

## Say modules — correct path is say/, NOT applications/
say/mod_say_en
say/mod_say_ar

## Databases
databases/mod_pgsql
#databases/mod_sqlite

## Formats (audio file I/O)
formats/mod_sndfile
formats/mod_local_stream
formats/mod_tone_stream
# mod_portaudio requires PortAudio (libportaudio20-dev); not needed on a
# headless server with no local audio device.
#formats/mod_portaudio
