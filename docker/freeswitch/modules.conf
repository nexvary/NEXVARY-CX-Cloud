## modules.conf — selects which modules are compiled into FreeSWITCH
## Lines starting with # are disabled; uncomment to enable.
##
## VERIFIED paths against FreeSWITCH v1.10.11 src/mod/ directory tree.
## All categories have been confirmed against the actual source layout.

## Core applications (src/mod/applications/)
applications/mod_commands
applications/mod_dptools
applications/mod_spandsp
applications/mod_voicemail
applications/mod_conference
applications/mod_ivr
applications/mod_hash
applications/mod_httapi
applications/mod_curl
applications/mod_tone_detect
applications/mod_expr
applications/mod_esl
applications/mod_callcenter

## Dialplan modules (src/mod/dialplans/ — NOT applications/)
dialplans/mod_dialplan_xml
dialplans/mod_dialplan_directory

## Endpoints (src/mod/endpoints/)
endpoints/mod_sofia
endpoints/mod_loopback

## Event socket and CDR (src/mod/event_handlers/)
event_handlers/mod_event_socket
event_handlers/mod_cdr_csv

## XML interface modules (src/mod/xml_int/ — NOT applications/)
xml_int/mod_xml_cdr
xml_int/mod_xml_curl

## Codecs (src/mod/codecs/)
codecs/mod_opus
codecs/mod_g711
codecs/mod_g722
codecs/mod_g726
codecs/mod_gsm
codecs/mod_speex
codecs/mod_ilbc
# mod_amr requires libopencore-amrnb-dev, not installed
#codecs/mod_amr
# mod_vp8 is a video codec, not needed for a voice PBX
#codecs/mod_vp8

## Loggers (src/mod/loggers/)
loggers/mod_console
loggers/mod_logfile
loggers/mod_syslog

## Timers (src/mod/timers/)
timers/mod_timerfd

## Languages (src/mod/languages/)
languages/mod_lua

## Say modules (src/mod/say/ — NOT applications/)
say/mod_say_en
say/mod_say_ar

## Databases (src/mod/databases/)
databases/mod_pgsql

## Formats / audio file I/O (src/mod/formats/)
formats/mod_sndfile
formats/mod_local_stream
formats/mod_tone_stream
