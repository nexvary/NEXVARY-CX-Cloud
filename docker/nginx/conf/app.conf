server {
    listen 80 default_server;
    server_name _;
    root /var/www/nexvary-cx/public;
    index index.php;

    # Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Laravel front-controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite-built assets have content-hash names — cache aggressively
    location ~* ^/build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static assets (favicons, images, fonts)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PHP-FPM via TCP socket to app container
    # Use $document_root (not $realpath_root) so paths match the app container's view
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT    $document_root;
        # Forwarded-host headers from the upstream TLS proxy
        fastcgi_param  HTTP_HOST        $http_x_forwarded_host;
        fastcgi_param  HTTPS            $http_x_forwarded_proto;
    }

    # WebSocket proxy for rtc-bridge
    location /ws {
        proxy_pass         http://rtc-bridge:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
    }

    # rtc-bridge health / ICE config endpoints
    location ~* ^/(health|ice-config)$ {
        proxy_pass         http://rtc-bridge:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_read_timeout 10;
    }

    # Laravel health endpoint (no auth required for load balancer probes)
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    client_max_body_size 50M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
